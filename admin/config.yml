backend:
  name: github
  repo: studio-maxwaelbers/lydiastavraki
  branch: main

media_folder: "images"
public_folder: "images"

collections:
  - name: "about"
    label: "About Section"
    files:
      - file: "about.json"
        label: "About Text"
        name: "about"
        fields:
          - { label: "Bio Header Tagline", name: "bioTag", widget: "string" }
          - label: "Bio Paragraphs"
            name: "bioColumns"
            widget: "list"
            field: { label: "Paragraph Text", name: "paragraph", widget: "text" }
            
  - name: "concerts"
    label: "Concert Dates"
    files:
      - file: "concerts.json"
        label: "Concerts List"
        name: "concerts"
        fields:
          - { label: "Dates Footer Text", name: "datesFooter", widget: "text" }
          - label: "Concert Dates"
            name: "concerts"
            widget: "list"
            fields:
              - { label: "Concert Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
              - { label: "Display Date Text (e.g. 12 June '26)", name: "displayDate", widget: "string", required: false }
              - { label: "Event Details", name: "event", widget: "string" }