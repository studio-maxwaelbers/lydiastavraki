<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager</title>
  <!-- Netlify Identity Widget -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  
  <style>
    /* Direct CSS override */
    a[href*="media"],
    a[href="#/media"],
    [class*="AppHeader"] a:nth-of-type(2) {
      display: none !important;
    }
  </style>
</head>
<body>
  <!-- Decap CMS Script -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <!-- Continuous DOM scanner script -->
  <script>
    function hideMediaTab() {
      const elements = document.querySelectorAll('a, button, span, div');
      elements.forEach(el => {
        const href = el.getAttribute('href') || '';
        const text = el.textContent ? el.textContent.trim() : '';
        
        if (href.includes('media') || text === 'Media') {
          const tab = el.closest('a') || el.closest('button') || el;
          tab.style.setProperty('display', 'none', 'important');
          tab.style.setProperty('visibility', 'hidden', 'important');
        }
      });
    }

    // Run repeatedly to override React re-renders
    setInterval(hideMediaTab, 100);
  </script>
</body>
</html>
